name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: flintylemming/task-sentinel

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On tag v1.2.3 this produces 1.2.3, 1.2, 1 and latest
          # (latest is skipped for pre-releases such as v1.2.3-rc.1).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Only stable version tags move `latest`, which is what the server runs.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions: {}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || 'appdata/8856-task-sentinel' }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Pull image and recreate container
        run: |
          # The login shell on the server is fish, so run the script through bash.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$DEPLOY_DIR" "$GITHUB_SHA" <<'EOF'
          set -euo pipefail
          cd "$1"
          want="$2"
          image="$(docker compose config --images | head -n1)"

          # The server pulls through a registry mirror, which can lag behind
          # GHCR. Retry until the pulled image was built from this commit.
          for attempt in $(seq 1 10); do
            docker compose pull --quiet
            got="$(docker image inspect "$image" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            [ "$got" = "$want" ] && break
            echo "attempt $attempt: image is at ${got:-unknown}, want $want"
            [ "$attempt" = 10 ] && { echo "mirror never served the new image" >&2; exit 1; }
            sleep 30
          done

          docker compose up -d --remove-orphans
          sleep 5
          docker compose ps
          running="$(docker compose ps --status running --quiet | wc -l)"
          [ "$running" -ge 1 ] || { docker compose logs --tail 50; exit 1; }
          docker image prune -f >/dev/null
          EOF
